# This configuration works for both Codex Desktop and Codex CLI with a local checkout.
#
# Codex Desktop: open Settings > Configuration > Open config.toml and add this block.
# Codex CLI: this is the shared ~/.codex/config.toml file; codex mcp add can also create it.
# No `codex` command is required for the Desktop path.
# Requires this repository to be cloned and built, plus the Super Productivity desktop app
# 18.16.0 or newer with its local REST API enabled.
# This GitHub fork has not been published to npm. The npx package command installs the
# original published distribution; use the local build path below for this fork.
# Super Productivity 18.16.0 does not require or display a token.

[mcp_servers.super_productivity]
command = "node"
args = ["/path/to/super-productivity-mcp/dist/index.js"]
env = { SP_API_URL = "http://127.0.0.1:3876", SP_LOG_LEVEL = "warn" }

# For a future token-enabled build, uncomment this and export SP_API_TOKEN before starting Codex.
# env_vars = ["SP_API_TOKEN"]
# After changing SP_API_TOKEN, restart the Desktop app or CLI and use /mcp to verify the server.

# If a token is required by your app build, export SP_API_TOKEN in the host environment.
# Do not place the token value in this configuration file.
# To use the upstream npm release instead, use command = "npx" and args = ["-y", "super-productivity-mcp-server"].
