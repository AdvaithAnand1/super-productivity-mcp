name: Feature request
description: Suggest a focused improvement to the explicit workflow.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What concrete workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest explicit interaction that would solve it.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Workflow safety
      options:
        - label: This does not require implicit imports or unbounded background automation.
          required: true
